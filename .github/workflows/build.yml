name: Build APK v3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK v3
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: false

      - name: Install SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate debug keystore for CI
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"
          ls -la ~/.android/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK v3
        run: |
          set +e
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/gradle.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            echo ""
            echo "=== ERRORES KOTLIN (lineas que empiezan con e:) ==="
            grep -E "^e: " /tmp/gradle.log || echo "(no se encontraron lineas e:)"
            echo ""
            echo "=== ULTIMAS 60 LINEAS DEL LOG ==="
            tail -n 60 /tmp/gradle.log
            exit $EXIT
          fi

      - name: Locate and rename APK
        id: locate
        if: success()
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No se genero ningun APK"
            find app/build/outputs -type f || true
            exit 1
          fi
          echo "apk=$APK_PATH" >> $GITHUB_OUTPUT
          mkdir -p dist
          cp "$APK_PATH" dist/clon-cf-v3.apk
          ls -la dist/

      - name: Upload release APK v3
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-release-v3
          path: dist/clon-cf-v3.apk
          if-no-files-found: error
          retention-days: 30
